name: Validation et déploiement
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mprovi_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/mprovi_test_ci
      TEST_STORAGE_ROOT: /tmp/mprovi-ci-integration
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm run check && npm test
      - name: Client PostgreSQL 17 pour le test de restauration
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Syntaxe PHP et scripts Debian
        run: |
          find moodle -name '*.php' -print0 | xargs -0 -n1 php -l
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
      - name: Apache derrière le reverse proxy
        run: |
          sudo apt-get install -y apache2 libapache2-mod-xsendfile
          node tests/performance/apache-proxy.mjs
      - run: mkdir -m 700 "$TEST_STORAGE_ROOT" && npm run test:integration
      - name: Préparer le navigateur
        run: npx playwright install --with-deps chromium
      - name: Installation réelle des plugins et éditeur TinyMCE sur Moodle 5.2
        run: |
          sudo apt-get install -y php8.3-cli php8.3-gd php8.3-pgsql php8.3-curl php8.3-intl php8.3-mbstring php8.3-xml php8.3-zip
          mkdir "$RUNNER_TEMP/moodle-source"
          curl --fail --location --proto '=https' --tlsv1.2 https://codeload.github.com/moodle/moodle/tar.gz/28fdef85e7043c8dd758af8c1a146da1419db0d0 --output "$RUNNER_TEMP/moodle.tar.gz"
          tar -xzf "$RUNNER_TEMP/moodle.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/moodle-source"
          cat > "$RUNNER_TEMP/php-moodle" <<'SH'
          #!/bin/sh
          exec /usr/bin/php8.3 -d max_input_vars=5000 -d memory_limit=512M "$@"
          SH
          chmod 700 "$RUNNER_TEMP/php-moodle"
          MOODLE_QA_BROWSER=1 MOODLE_PHP_BINARY="$RUNNER_TEMP/php-moodle" MOODLE_SOURCE_DIR="$RUNNER_TEMP/moodle-source" TEST_STORAGE_ROOT="$RUNNER_TEMP/moodle-storage" bash tests/moodle/install-debian.sh
      - name: Parcours navigateur avec serveur isolé
        run: |
          /usr/lib/postgresql/17/bin/createdb --host=127.0.0.1 --username=postgres mprovi_test_browser
          mkdir -m 700 /tmp/mprovi-ci-browser
          DATABASE_URL=postgresql://postgres:test-only@127.0.0.1:5432/mprovi_test_browser TEST_STORAGE_ROOT=/tmp/mprovi-ci-browser npm run dev:fixture > /tmp/mprovi-browser.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/e2e/browser.test.mjs --workers=1
        env:
          PGPASSWORD: test-only
      - run: npm audit --omit=dev --audit-level=high
      - name: Construire la livraison
        if: github.event_name != 'pull_request'
        run: node scripts/package-release.mjs "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: moodle-plugins-${{ github.sha }}
          path: dist/moodle/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ github.run_id }}
          path: |
            test-results/
            .qualification/moodle-install.json
            /tmp/mprovi-browser.log
          retention-days: 14
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MPROVI_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, mprovi-deploy]
    environment: production
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # No checkout, dependency build or PR execution on the production VM.
      - name: Déployer la livraison validée
        env:
          RELEASE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | sudo -n /usr/local/sbin/mprovi-deploy "$RELEASE_SHA" "$WORKFLOW_RUN_ID"
